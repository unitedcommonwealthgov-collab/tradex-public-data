name: Publish GDP snapshot
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gdp-snapshot
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate validated public snapshot
        run: python3 scripts/update_gdp.py
      - name: Commit and publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gdp-snapshot.json public/gdp-history.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Update public GDP snapshot"
          git push origin HEAD:main
